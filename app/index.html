<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style poster maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>VICE COVER<br>STUDIO</h1>
      <p class="tag">Turn a photo into GTA-style poster art. Offline, on your machine — your photos never leave it.</p>
    </header>

    <label class="field">Photo
      <input id="photo" type="file" accept="image/*">
    </label>
    <div class="samples" role="group" aria-label="Sample photos">
      <button type="button" data-sample="boulevard" class="sample active">Boulevard</button>
      <button type="button" data-sample="neon" class="sample">Neon Street</button>
      <button type="button" data-sample="pier" class="sample">Pier</button>
    </div>

    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label class="field">Tagline
      <input id="tagline" type="text" maxlength="24" value="Vice City">
    </label>

    <div class="field">Size
      <div class="segmented" id="size-picker" role="group" aria-label="Export size">
        <button type="button" data-value="square">1080²</button>
        <button type="button" data-value="portrait">1080×1350</button>
        <button type="button" data-value="wide" class="active">1920×1080</button>
      </div>
    </div>

    <div class="field">Panels
      <div class="segmented" id="layout-picker" role="group" aria-label="Panel layout">
        <button type="button" data-value="diagonal" class="active">Diagonal</button>
        <button type="button" data-value="grid">Grid</button>
      </div>
    </div>

    <div class="field">Grade
      <div class="segmented" id="grade-picker" role="group" aria-label="Colour grade">
        <button type="button" data-value="sunset" class="active">Vice Sunset</button>
        <button type="button" data-value="neon">Neon Nights</button>
      </div>
    </div>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status">Pick a photo, or try a sample.</p>
    <p class="fine">Diagonal five-panel poster · hero + three vignettes · drawn neon skyline · real cinematic grade. Fonts: Anton (SIL OFL).</p>
  </section>

  <section class="preview" aria-label="Live cover preview">
    <canvas id="cover" width="1920" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
